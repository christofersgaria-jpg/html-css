<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabelas</title>
    <style>
        body{

        }

        table {
            border-collapse: collapse;
        }

        th, td{
            border: 1px solid rgb(0, 0, 0);
        }

        th{
            background-color: gray;
            color: white;
            font-family: Arial, Helvetica, sans-serif;
        }

        th.Média{
            color: black;
            background-color: white;
        }
        
           
    </style>
</head>
<body>
    <table>
    <thead>
        <tr>
            <th rowspan="2" colspan="2">Área</th>
            <th colspan="3" scope="col">Diciplinas</th>
            <th colspan="2" scope="colgroup">Nota</th>
            <th>Média</th>
            
        
        </tr>
        <tr>
            <th scope="colgroup">Nota 1</th>
            <th scope="colgroup">Nota 2</th>
        </tr>
    </thead>

        <tr>
            <th rowspan="4" colspan="2" class="Média">Exatas</th>
            <td colspan="3">Matemática</td>
            <td>0.0</td>
            <td>0.0</td>
            <td>0.0</td>
        </tr>
        <tr>
            <td colspan="3">Física</td>
            <td>0.0</td>
            <td>0.0</td>
            <td>0.0</td>
        </tr>
        <tr>
            <td colspan="3">Química</td>
            <td>0.0</td>
            <td>0.0</td>
            <td>0.0</td>
        </tr>
        <tr>
            <td colspan="3">Biologia</td>
            <td>0.0</td>
            <td>0.0</td>
            <td>0.0</td>
        </tr>
        <tr>
            <th colspan="7">Média de Exatas</th>
            <th>0.0</th>
        </tr>
        <tr>
            <th rowspan="2" colspan="2" class="Média">Humanas</th>
            <td colspan="3">História</td>
            <td>0.0</td>
            <td>0.0</td>
            <td>0.0</td>
        </tr>
        <tr>
            <td colspan="3">Geografia</td>
            <td>0.0</td>
            <td>0.0</td>
            <td>0.0</td>
        </tr>
        <tr>
            <th colspan="7">Média de Humanas</th>
            <th>0.0</th>
        </tr>
    
    </table>
</body>
</html>
