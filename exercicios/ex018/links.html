<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>links</title>
    <style>


        /*
           SELETORES PERSONALIZADOS
           #  = id
           .  = class
           :  = pseudo-class
           :: = pseudo-element
           >  = clildren
        */
        body {
            font-family: Arial, Helvetica, sans-serif;
            
        }

        a {
            color: red;
            text-decoration: none;
            
        }

        a:visited {
            color: darkred;
            text-decoration: underline;
        }

        a:hover {
            color: black;
            text-decoration: underline;
        }

        a::before {
            content:' ⇒ ';
            color: black;
            
        }

        a::after {
            content: ' ⇐ ';
            
        }
    </style>
</head>
<body>
    <h1>Personalizando Links</h1>
    <ul>
        <li> <a href="https://gustavoguanabara.github.io" target="_blank">Repositório GitHub</a></li>
        <li><a href="https://youtube.com/cursoemvideo/" target="_blank">Canal do Youtube</a></li>
        <li><a href="https://www.cursoemvideo.com">Site Cursoemvídeo</a></li>
    </ul>

    
</body>
</html>
